<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><title>Validação visual PNG Futebol</title>
<style>body{margin:0;background:#101628;color:#fff;font-family:sans-serif}
#preview{max-width:550px;margin:auto}img{display:block;width:100%;height:auto}</style>
</head><body><div id="preview"></div><pre id="results" data-status="pending">running</pre>
<script type="module">
import { drawFootballPngFallback } from "/src/lib/vitrine-football-canvas-fallback.ts";
const status=document.querySelector("#results");
function artImage(color,label){
  const c=document.createElement("canvas");c.width=c.height=256;
  const t=c.getContext("2d");
  t.clearRect(0,0,256,256);
  t.fillStyle=color;t.fillRect(0,0,256,256);
  t.fillStyle="#ffffff";t.font="bold 62px Arial";t.fillText(label,36,158);
  return c.toDataURL("image/png");
}
const logo=artImage("#ed10ae","LM");
const home=artImage("#18e5aa","H");
const away=artImage("#f4a316","A");
const matches=Array.from({length:4},(_,i)=>({
  id:"match-"+i,
  home:["Singapore","Ireland","Poland","Wales"][i],
  away:["Brazil","Kosovo","Sweden","Portugal"][i],
  league:i===0?"Amistoso Internacional":"Liga das Nações",
  day:"2026-11-17",time:i===0?"07:00":"16:45",
  homeBadge:home,awayBadge:away,
  broadcasts:[["Globo","SporTV","ge tv"],["Disney+"],["SportTV 2"],["SporTV"]][i],
}));
function existsInRect(ctx,color,x,y,w,h){
  const d=ctx.getImageData(x,y,w,h).data;
  for(let i=0;i<d.length;i+=4*10){
    if(Math.abs(d[i]-color[0])<=12 &&
       Math.abs(d[i+1]-color[1])<=12 &&
       Math.abs(d[i+2]-color[2])<=12)return true;
  }
  return false;
}
try{
  const out=[];
  for(const count of [4,1,2,3]){
    const file=await drawFootballPngFallback({
      matches:matches.slice(0,count),day:"2026-11-17",
      accent:"#146df2",logo,contact:"85998545009",
      name:"Revenda Exemplo",filename:"football-"+count+".png"
    });
    if(file.type!=="image/png")throw Error("MIME inválido");
    const header=new DataView(await file.slice(0,24).arrayBuffer());
    if(header.getUint32(0)!==0x89504e47||header.getUint32(16)!==2160||header.getUint32(20)!==2700)
      throw Error("Arquivo PNG não possui resolução exata");
    const bitmap=await createImageBitmap(file);
    if(bitmap.width!==2160||bitmap.height!==2700)throw Error("PNG não decodificou no tamanho esperado");
    const canvas=document.createElement("canvas");canvas.width=2160;canvas.height=2700;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bitmap,0,0);bitmap.close();
    if(!existsInRect(ctx,[237,16,174],220,145,430,370))
      throw Error("Logo colorida desapareceu da imagem");
    for(let i=0;i<count;i++){
      const rowY=367+i*((count===1?205:153)+18);
      if(!existsInRect(ctx,[24,229,170],140,(rowY+52)*2,125,130))
        throw Error("Escudo mandante ausente na partida "+(i+1));
      if(!existsInRect(ctx,[244,163,22],1890,(rowY+52)*2,140,130))
        throw Error("Escudo visitante ausente na partida "+(i+1));
    }
    const foot=ctx.getImageData(100,2460,500,70).data;
    let dark=0;for(let p=0;p<foot.length;p+=4)if(foot[p]<130)dark++;
    if(dark<100)throw Error("Rodapé/WhatsApp incompleto");
    out.push({matches:count,bytes:file.size,width:bitmap.width||2160,height:bitmap.height||2700,
      logo:true,badges:count*2,footer:true});
    if(count===4){
      const img=document.createElement("img");
      img.src=URL.createObjectURL(file);img.alt="PNG exato gerado pelo exportador nativo";
      document.querySelector("#preview").appendChild(img);
    }
  }
  // The real case: eight OFFLINE circular team flags without any remote CDN.
  // This catches the old regressed "K" and "PG" placeholders for Kosovo/Wales.
  const roundFlags=matches.map(m=>({...m,homeBadge:"",awayBadge:""}));
  const circular=await drawFootballPngFallback({
    matches:roundFlags,day:"2026-11-17",accent:"#146df2",
    logo,contact:"85998545009",name:"Revenda Exemplo",
    filename:"round-flags-2160x2700.png"
  });
  const flagBitmap=await createImageBitmap(circular);
  if(flagBitmap.width!==2160||flagBitmap.height!==2700)
    throw Error("Bandeiras offline: PNG com dimensões incorretas");
  const flagCanvas=document.createElement("canvas");
  flagCanvas.width=2160;flagCanvas.height=2700;
  const fc=flagCanvas.getContext("2d",{willReadFrequently:true});
  fc.drawImage(flagBitmap,0,0);flagBitmap.close();
  const regionFor=(index,left)=>({
    x:left?146:1906,
    y:(367+index*(153+18)+48)*2,
    w:106,h:106
  });
  const checks=[
    [0,true,[216,0,39],"Singapura"],
    [0,false,[109,165,68],"Brasil"],
    [1,false,[0,82,180],"Kosovo"],
    [3,true,[216,0,39],"País de Gales"]
  ];
  for(const [i,left,color,team] of checks){
    const rect=regionFor(i,left);
    if(!existsInRect(fc,color,rect.x,rect.y,rect.w,rect.h))
      throw Error("Falhou bandeira circular offline de "+team+" (não pode virar K/PG)");
  }
  // Run the case again with only Singapore's source missing.
  const missingSingapore=[...matches];
  missingSingapore[0]={...missingSingapore[0],homeBadge:""};
  const rescue=await drawFootballPngFallback({
    matches:missingSingapore,day:"2026-11-17",accent:"#146df2",
    logo,contact:"85998545009",name:"Revenda Exemplo",
    filename:"singapore-recovered.png"
  });
  const rescueBitmap=await createImageBitmap(rescue);
  const rescueCanvas=document.createElement("canvas");
  rescueCanvas.width=2160;rescueCanvas.height=2700;
  const rescueCtx=rescueCanvas.getContext("2d",{willReadFrequently:true});
  rescueCtx.drawImage(rescueBitmap,0,0);rescueBitmap.close();
  if(!existsInRect(rescueCtx,[216,0,39],146,(367+48)*2,106,106))
    throw Error("Fallback Singapura não retornou a bandeira original circular");
  out.push({matches:4,case:"eight true circular flags including Kosovo and Wales",png:true});
  out.push({matches:4,case:"missing Singapore CDN",restored:"round Singapore flag",png:true});
  // Finished-game banner must be a genuine full-resolution score graphic,
  // selected only AFTER FTWB confirms both final status and numeric score.
  const originalText=CanvasRenderingContext2D.prototype.fillText;
  const drawnLabels=[];
  CanvasRenderingContext2D.prototype.fillText=function(value,...rest){
    drawnLabels.push(String(value));
    return originalText.call(this,value,...rest);
  };
  try{
    const match={...matches[0],status:"encerrado",scoreLabel:"2 × 1",
      homeBadge:"",awayBadge:""};
    const final=await drawFootballPngFallback({
      matches:[match],kind:"finished",day:"2026-11-17",accent:"#146df2",
      logo,contact:"85998545009",name:"Revenda Exemplo",
      filename:"fim-de-jogo-2160x2700.png"
    });
    const bmp=await createImageBitmap(final);
    if(bmp.width!==2160||bmp.height!==2700)
      throw Error("Fim de jogo: PNG com resolução incorreta");
    const finalCanvas=document.createElement("canvas");
    finalCanvas.width=2160;finalCanvas.height=2700;
    const ctx=finalCanvas.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bmp,0,0);bmp.close();
    for(const label of ["FIM DE","JOGO","APITO FINAL","RESULTADO FINAL",
        "2","1","Brasil","Singapura"]){
      if(!drawnLabels.includes(label))throw Error("Fim de jogo não exibiu "+label);
    }
    // Real offline flags are SG red and BR green, not the turquoise/orange
    // placeholder badges used by the old fixture test.
    if(!existsInRect(ctx,[216,0,39],250,(360+205)*2,330,320))
      throw Error("Fim de jogo perdeu a bandeira circular de Singapura");
    if(!existsInRect(ctx,[109,165,68],1588,(360+205)*2,340,320))
      throw Error("Fim de jogo perdeu a bandeira circular do Brasil");
    out.push({case:"finished",status:"encerrado",score:"2 × 1",width:2160,
      height:2700,flags:true,header:true,footer:true,bytes:final.size});
    let rejected=false;
    try{
      await drawFootballPngFallback({matches:[{...match,status:"ao_vivo",scoreLabel:"2 × 1"}],
        kind:"finished",day:"2026-11-17",accent:"#146df2",
        logo,contact:"85998545009",name:"Revenda Exemplo",filename:"invalid.png"});
    }catch{rejected=true}
    if(!rejected)throw Error("Fim de jogo aceitou resultado ainda ao vivo");
  }finally{
    CanvasRenderingContext2D.prototype.fillText=originalText;
  }
  // Both official layouts must render using the same PNG generator.
  // Verify the second 2-column template at 12 fixtures with three palette
  // choices, 24 badges, single brand mark and intact WhatsApp footer.
  const fixtures12=Array.from({length:12},(_,i)=>({
    ...matches[i%4],id:"grid-"+i,home:"Equipe "+(i+1),away:"Visitante "+(i+1),
    homeBadge:home,awayBadge:away,
    league:i%2?"Liga das Nações":"Amistoso Internacional",
    broadcasts:i%2?["Disney+"]:["Globo","SporTV","ge tv"]
  }));
  const backdropSamples=[];
  for(const accent of ["#146df2","#ee1519","#db4796","#0ea56d","#c78d11","#7953b1"]){
    const painted=[];
    const original=CanvasRenderingContext2D.prototype.fillText;
    CanvasRenderingContext2D.prototype.fillText=function(text,...args){
      painted.push(String(text));return original.call(this,text,...args);
    };
    let gridFile;
    try{
      gridFile=await drawFootballPngFallback({
        matches:fixtures12,kind:"grid",day:"2026-11-17",accent,
        logo,contact:"85998545009",name:"Revenda Exemplo",
        filename:"grid-"+accent.substring(1)+".png"
      });
    }finally{CanvasRenderingContext2D.prototype.fillText=original;}
    const header=new DataView(await gridFile.slice(0,24).arrayBuffer());
    if(header.getUint32(16)!==2160||header.getUint32(20)!==2700)
      throw Error("Modelo Grade: dimensões PNG incorretas");
    const bitmap=await createImageBitmap(gridFile);
    if(bitmap.width!==2160||bitmap.height!==2700)
      throw Error("Modelo Grade: PNG inválido");
    const canvas=document.createElement("canvas");canvas.width=2160;canvas.height=2700;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bitmap,0,0);bitmap.close();
    for(const label of ["JOGOS","DO DIA","FALE PELO WHATSAPP","ASSISTA EM","QUALQUER DISPOSITIVO"]){
      if(!painted.includes(label))throw Error("Modelo Grade não exibiu "+label);
    }
    if(!existsInRect(ctx,[237,16,174],770,65,630,180))
      throw Error("Modelo Grade: logo da revenda desapareceu");
    const rowH=Math.floor((1147-322-5*13)/6);
    const size=Math.min(91,Math.max(76,Math.round(rowH*.63)));
    for(let i=0;i<12;i++){
      const row=Math.floor(i/2),col=i%2,x=43+col*(488+18),
        y=322+row*(rowH+13)+(rowH<140?45:51);
      if(!existsInRect(ctx,[24,229,170],(x+21)*2,y*2,size*2,size*2))
        throw Error("Modelo Grade: escudo mandante ausente do jogo "+(i+1));
      if(!existsInRect(ctx,[244,163,22],(x+488-size-21)*2,y*2,size*2,size*2))
        throw Error("Modelo Grade: escudo visitante ausente do jogo "+(i+1));
      if(!painted.includes("Equipe "+(i+1)+" × Visitante "+(i+1)))
        throw Error("Modelo Grade: nome do jogo "+(i+1)+" não apareceu completo");
    }
    // Real decoded pixels, sampled on the stadium outside the white cards.
    // Colors must change throughout the artwork, not merely on card borders.
    const sample=[...ctx.getImageData(60,430,1,1).data].slice(0,3);
    backdropSamples.push({accent,sample});
    const foot=ctx.getImageData(120,2460,450,70).data;
    if(foot.length<2000)throw Error("Modelo Grade: rodapé incompleto");
    out.push({case:"two-column",accent,matches:12,width:2160,height:2700,
      logos:1,badges:24,footer:true,bytes:gridFile.size,backdropPixel:sample});
  }
  const uniqueBackdrops=new Set(backdropSamples.map(v=>v.sample.join(",")));
  if(uniqueBackdrops.size!==backdropSamples.length)
    throw Error("Fundo de estádio não muda em todas as cores: "+JSON.stringify(backdropSamples));
  status.textContent="FOOTBALL_RENDER_PASS "+JSON.stringify(out);
  status.dataset.status="pass";
}catch(e){
  status.textContent="FOOTBALL_RENDER_FAIL "+(e?.stack||String(e));
  status.dataset.status="fail";
}
</script></body></html>
