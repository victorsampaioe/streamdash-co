name: Private migration metadata safety tests
on:
  pull_request:
    paths:
      - 'cloudflare/migration-sandbox/private-metadata-pull.mjs'
      - 'cloudflare/migration-sandbox/private-metadata-pull.test.mjs'
      - '.github/workflows/private-migration-metadata-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run isolated Worker tests
        run: npx vitest run cloudflare/migration-sandbox/private-metadata-pull.test.mjs
