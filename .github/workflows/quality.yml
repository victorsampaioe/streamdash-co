name: Code quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bunx vitest run
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Production build
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          VITE_SUPABASE_PROJECT_ID: "ci"
        run: bun run build
      - name: Real Chromium PNG render — 2160 x 2700
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          VITE_SUPABASE_PROJECT_ID: "ci"
        run: |
          set -euo pipefail
          bunx vite --config test/vite.football.config.ts > /tmp/vite-football.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/test/football-export-harness.html >/dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo 'Chromium/Chrome ausente'; exit 1; fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-allow-origins='*' --remote-debugging-port=9222 \
            --user-data-dir=/tmp/football-chrome-verification about:blank \
            > /tmp/football-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER" 2>/dev/null || true' EXIT
          if ! node scripts/verify-football-browser.mjs; then
            echo "Chrome launch/debug logs:"
            tail -50 /tmp/football-chrome.log || true
            echo "Vite server:"
            tail -50 /tmp/vite-football.log || true
            exit 1
          fi
      - name: Verify published blog article routes
        run: |
          grep -Fq "BlogComoEvitarQuedaIptvRouteImport" src/routeTree.gen.ts
          grep -Fq "BlogComoSaberSeServidorIptvCaiuRouteImport" src/routeTree.gen.ts
          grep -Fq "BlogDnsIptvNaoResolveRouteImport" src/routeTree.gen.ts
