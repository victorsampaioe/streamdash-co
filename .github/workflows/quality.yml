name: Code quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bunx vitest run
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Production build
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          VITE_SUPABASE_PROJECT_ID: "ci"
        run: bun run build
      - name: Verify published blog article routes
        run: |
          grep -Fq "BlogComoEvitarQuedaIptvRouteImport" src/routeTree.gen.ts
          grep -Fq "BlogComoSaberSeServidorIptvCaiuRouteImport" src/routeTree.gen.ts
          grep -Fq "BlogDnsIptvNaoResolveRouteImport" src/routeTree.gen.ts
